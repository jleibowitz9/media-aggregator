email:
  subject_prefix: "Media Digest"
  max_items_per_section: 25
  max_items_per_feed: 3
  # Per-source overrides to the default max_items_per_feed. The Verge publishes
  # heavily, so surface more of it each day (its RSS feed holds up to ~10 items).
  max_items_per_feed_overrides:
    The Verge: 10
